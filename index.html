<script>
    const catalogContainer = document.getElementById('catalog');
    let totalSongsCount = 0;
    let currentGenre = 'all';

    function initCatalog() {
        catalogContainer.innerHTML = '';
        totalSongsCount = 0;

        baseCatalog.forEach(item => {
            item.songs.forEach(song => {
                const songDiv = document.createElement('div');
                songDiv.className = 'song-item';
                songDiv.setAttribute('data-genre', item.genre);
                // Додаємо чітку примітку караоке версії до кожної назви пісні без дублікатів
                songDiv.innerHTML = `<span class="title">${song} (Караоке версія)</span><span class="artist">${item.artist}</span>`;
                catalogContainer.appendChild(songDiv);
                totalSongsCount++;
            });
        });
        document.getElementById('total-songs').textContent = `Доступно унікальних треків: ${totalSongsCount}`;
    }

    initCatalog();

    const searchInput = document.getElementById('search');
    const filterButtons = document.querySelectorAll('.filter-btn');
    
    function filterSongs() {
        const filterText = searchInput.value.toLowerCase().trim();
        const songItems = document.querySelectorAll('.song-item');
        let hasResults = false;

        songItems.forEach(item => {
            const title = item.querySelector('.title').textContent.toLowerCase();
            const artist = item.querySelector('.artist').textContent.toLowerCase();
            const itemGenre = item.getAttribute('data-genre');

            const matchesSearch = title.includes(filterText) || artist.includes(filterText);
            const matchesGenre = currentGenre === 'all' || itemGenre === currentGenre;

            if (matchesSearch && matchesGenre) {
                item.style.display = 'flex';
                hasResults = true;
            } else {
                item.style.display = 'none';
            }
        });

        document.getElementById('no-results').style.display = hasResults ? 'none' : 'block';
    }

    searchInput.addEventListener('input', filterSongs);

    filterButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            filterButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentGenre = this.getAttribute('data-genre');
            filterSongs();
        });
    });
</script>
